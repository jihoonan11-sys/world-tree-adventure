name: Build and deploy Pages

# 자동 실행 조건
#  - release published : Release 를 '게시(Publish)'했을 때
#  - workflow_dispatch : Actions 탭에서 'Run workflow' 버튼을 눌렀을 때 (수동)
#  - push to main      : index.html / models.json / 이 워크플로 / 스크립트가 바뀌었을 때
# 이미 게시된 Release 에 파일만 추가하는 경우에는 자동 실행을 기대하지 마세요 (확인 필요).
# 그때는 수동 실행(workflow_dispatch)을 사용하세요.
on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "models.json"
      - ".github/workflows/deploy-pages.yml"
      - ".github/scripts/**"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # release 이벤트는 태그 시점 코드를 쓰므로, 항상 기본 브랜치의 최신 index.html/models.json 을 사용
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}

      - name: Build site (download + verify models)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/build-site.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Smoke test (headless browser, local server)
        run: |
          python3 -m http.server 8080 --directory _site >/dev/null 2>&1 &
          sleep 2
          node .github/scripts/smoke-test.mjs http://127.0.0.1:8080/ smoke-out

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: smoke-out
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    # 저장소 변수 ENABLE_PAGES_DEPLOY 가 'true' 일 때만 실제 배포 (Pages Source 전환 전에는 빌드 검증만 실행)
    if: ${{ vars.ENABLE_PAGES_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  live-smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Wait until the new deployment is live
        env:
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          RUN_ID: ${{ github.run_id }}
        run: |
          for i in $(seq 1 30); do
            got=$(curl -fsS -H 'Cache-Control: no-cache' "${SITE}models/manifest.json?t=$(date +%s)" 2>/dev/null | python3 -c 'import sys,json; print(json.load(sys.stdin).get("run_id",""))' 2>/dev/null || true)
            echo "시도 $i: manifest run_id='$got' (기대: $RUN_ID)"
            [ "$got" = "$RUN_ID" ] && exit 0
            sleep 10
          done
          echo "::error::배포 반영을 5분 안에 확인하지 못했습니다"
          exit 1

      - name: Smoke test against the live site
        env:
          EXPECT_RUN_ID: ${{ github.run_id }}
        run: node .github/scripts/smoke-test.mjs "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" smoke-live

      - name: Upload live smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-live-results
          path: smoke-live
          retention-days: 7
          if-no-files-found: ignore
